<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chore Wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: a cutaway house. Roof carries the title, Team A and Team B rooms flank a numbered mystery wheel,
   wooden floor at the bottom holds the teacher's controls. Challenge cards show the artwork with the task. */
:root{
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Andika','Trebuchet MS',system-ui,sans-serif;

  --text:#1E2A44;
  --line:#1E2A44;
  --muted:#4F6280;
  --wall:#D5ECF4;
  --wall-dot:#C1DFEB;
  --paper:#FFFFFF;
  --paper-2:#EAF4F9;
  --roof:#2F7184;
  --roof-2:#2A6475;
  --roof-dark:#1F5262;
  --floor:#D8A164;
  --floor-line:#C28A4F;
  --on-floor:#1E2A44;
  --a:#D63C2E;
  --b:#2A68D1;
  --good:#2F9E5B;
  --soft:#6B7FA3;

  --sun:#F5B82E;
  --navy:#1E2A44;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --text:#EAF1F7; --line:#0A121A; --muted:#A5B8CA;
    --wall:#15232E; --wall-dot:#1C2D39; --paper:#223645; --paper-2:#2D4658;
    --roof:#2B5C6A; --roof-2:#245160; --roof-dark:#1A3D48;
    --floor:#6E4B2C; --floor-line:#5B3D23; --on-floor:#F6EBDD;
    --a:#E0584B; --b:#4E88E8; --good:#3DB873; --soft:#8EA2C4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --text:#EAF1F7; --line:#0A121A; --muted:#A5B8CA;
  --wall:#15232E; --wall-dot:#1C2D39; --paper:#223645; --paper-2:#2D4658;
  --roof:#2B5C6A; --roof-2:#245160; --roof-dark:#1A3D48;
  --floor:#6E4B2C; --floor-line:#5B3D23; --on-floor:#F6EBDD;
  --a:#E0584B; --b:#4E88E8; --good:#3DB873; --soft:#8EA2C4;
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;
  background:var(--wall);
  background-image:radial-gradient(var(--wall-dot) 2.2px, transparent 2.7px);
  background-size:28px 28px;
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block:44px 28px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:1260px;margin:0 auto}

/* ---------- roof ---------- */
.roof-wrap{
  position:relative;margin:0 auto 26px;max-width:880px;
  filter:drop-shadow(3px 0 0 var(--line)) drop-shadow(-3px 0 0 var(--line)) drop-shadow(0 3px 0 var(--line)) drop-shadow(0 -3px 0 var(--line));
}
.roof{
  position:relative;
  clip-path:polygon(0 100%, 6% 0, 94% 0, 100% 100%);
  background:
    radial-gradient(circle at 50% 0, var(--roof-2) 0 12px, var(--roof-dark) 12.5px 14.5px, transparent 15px) 0 0/30px 20px,
    var(--roof);
  color:#fff;text-align:center;padding:16px 14% 18px;
}
.roof h1{margin:0;font:400 clamp(34px,5vw,54px)/1 var(--font-display);letter-spacing:.01em;text-shadow:0 3px 0 var(--roof-dark)}
.roof p{margin:6px 0 0;font-size:clamp(13px,1.7vw,17px);font-weight:700;opacity:.95}
.chimney{position:absolute;left:15%;top:-30px;width:44px;height:46px;background:var(--roof-dark)}

/* ---------- board ---------- */
.board{
  display:grid;gap:28px;align-items:start;
  grid-template-columns:minmax(210px,1fr) minmax(320px,640px) minmax(210px,1fr);
  justify-content:center;
}
.center{min-width:0;display:flex;flex-direction:column;align-items:center}

/* ---------- team panels ---------- */
.team{
  background:var(--tc);color:#fff;
  border:4px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--line);
  padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;margin-top:22px;
}
.team-name{
  width:100%;background:transparent;border:0;border-bottom:3px dashed rgba(255,255,255,.55);
  color:#fff;font:400 clamp(26px,3vw,36px)/1.1 var(--font-display);padding:2px 0 6px;border-radius:0;
}
.team-name:focus{border-bottom-style:solid;outline:none;border-bottom-color:#fff}
.score{display:flex;align-items:baseline;gap:10px}
.score output{display:block;font:400 clamp(76px,9vw,124px)/1 var(--font-display);font-variant-numeric:tabular-nums;text-shadow:0 5px 0 rgba(0,0,0,.22)}
.score span{font-weight:700;font-size:18px}
.pop{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.took{background:rgba(0,0,0,.16);border-radius:14px;padding:10px 12px 12px}
.took h3{margin:0 0 8px;font:400 17px/1 var(--font-display)}
.took ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-items:center}
.took li{width:44px;height:44px;border-radius:12px;border:3px solid var(--line);background:#fff;overflow:hidden}
.took li img{display:block;width:100%;height:100%;object-fit:cover}
.took .none{font-size:15px;opacity:.9;width:auto;height:auto;border:0;background:none;border-radius:0}

/* ---------- wheel ---------- */
.stage{
  position:relative;aspect-ratio:1;container-type:inline-size;
  width:min(100%, 640px, max(300px, calc(100vh - 330px)));margin-top:22px;
}
.stage::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--line);transform:translate(9px,9px)}
.wheel{position:relative;display:block;width:100%;height:100%;overflow:visible}
.wn{font-family:var(--font-display);font-size:78px;fill:#fff;stroke:var(--line);stroke-width:9px;paint-order:stroke;stroke-linejoin:round}
.shade{fill:var(--wall);opacity:0;transition:opacity .4s;stroke:none}
.shade.on{opacity:.82}
.pointer{position:absolute;left:50%;top:-4.4%;width:11.5%;transform:translateX(-50%);z-index:3;pointer-events:none}
.pin{transform-origin:50% 30%}
.pin svg{display:block;width:100%;height:auto}
.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:23%;aspect-ratio:1;border-radius:50%;border:5px solid var(--line);
  background:var(--paper);color:var(--text);font:400 7cqw/1 var(--font-display);
  box-shadow:0 5px 0 var(--line);transition:transform .1s, box-shadow .1s;
}
.hub:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.06)}
.hub:active:not(:disabled){transform:translate(-50%,calc(-50% + 4px));box-shadow:0 1px 0 var(--line)}
.hub:disabled{opacity:.7;cursor:default}
.status{margin:30px 0 0;padding:8px 18px;border:3px solid var(--line);border-radius:99px;background:var(--paper);font-weight:700;font-size:17px;box-shadow:3px 3px 0 var(--line);text-align:center}

/* ---------- floor ---------- */
.floor{
  margin-top:32px;border:4px solid var(--line);border-radius:16px;box-shadow:6px 6px 0 var(--line);
  background:repeating-linear-gradient(90deg, var(--floor) 0 140px, var(--floor-line) 140px 143px);
  color:var(--on-floor);padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;
}
.tog{position:relative;display:inline-flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:48px;height:28px;border-radius:99px;border:3px solid var(--line);background:var(--paper-2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--line);transition:transform .15s}
.tog input:checked + .sw{background:var(--sun)}
.tog input:checked + .sw::after{transform:translateX(20px)}
.tog:focus-within .sw{outline:3px solid var(--on-floor);outline-offset:2px}
.sel{display:inline-flex;align-items:center;gap:10px;font-weight:700}
.sel select{height:40px;border:3px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font-weight:700;padding:0 10px}
.spacer{flex:1}
.fbtn{
  height:40px;padding:0 18px;border-radius:12px;border:3px solid var(--line);background:var(--paper);color:var(--text);
  font:400 18px/1 var(--font-display);box-shadow:0 3px 0 var(--line);
}
.fbtn.primary{background:var(--sun);color:var(--navy)}
.fbtn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.fbtn:disabled{opacity:.5;cursor:default}
.hint{margin:16px 4px 0;font-size:14px;color:var(--muted);text-align:center}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(9,20,30,.64);display:grid;place-items:center;padding:16px;overflow:auto}
.overlay.top{z-index:36}
.card{
  --seg:#4DA8E6;
  width:min(780px,100%);background:var(--paper);color:var(--text);
  border:5px solid var(--line);border-radius:28px;box-shadow:10px 10px 0 var(--line);overflow:hidden;
  animation:rise .24s ease-out;margin:auto;
}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.band{display:flex;align-items:center;gap:18px;padding:16px 24px;background:var(--seg);border-bottom:5px solid var(--line);color:var(--navy)}
.badge{flex:none;width:76px;height:76px;border-radius:50%;border:5px solid var(--line);background:#fff;display:grid;place-items:center;font:400 44px/1 var(--font-display);color:var(--navy)}
.band h2{margin:0;font:400 clamp(30px,5vw,46px)/1.05 var(--font-display);text-wrap:balance}
.band small{display:block;font:700 15px/1.2 var(--font-body);margin-top:4px;opacity:.85}
.cbody{padding:20px 24px 22px;display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:22px;align-items:center}
.tile{
  width:100%;aspect-ratio:1;background:#fff;border:4px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--line);overflow:hidden;
  display:grid;place-items:center;position:relative;
}
.tile img{display:block;width:100%;height:100%;object-fit:contain}
.tile.flip img{animation:flip .5s ease-out}
@keyframes flip{from{transform:rotateY(90deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
.tile.hidden-art{background:var(--paper-2);border-style:dashed;color:var(--muted);text-align:center;padding:14px}
.tile.hidden-art b{display:block;font:400 76px/1 var(--font-display);color:var(--soft)}
.tile.hidden-art span{font-weight:700;font-size:14px;line-height:1.3}
.tcol{min-width:0;display:flex;flex-direction:column;gap:14px}
.how{margin:0;font-size:18px;line-height:1.4;font-weight:700}
.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.chip{font:400 28px/1 var(--font-display);padding:8px 16px;border:3px solid var(--line);border-radius:12px;color:var(--navy);background:#9CC9F5}
.chip[data-p="she"]{background:#F59A8B}
.chip[data-p="he"]{background:#8FC3F5}
.chip[data-p="they"]{background:#B9ADF5}
.frame{margin:0;font-size:clamp(22px,3.8vw,30px);font-weight:700;line-height:1.3;flex:1 1 200px;min-width:0}
.blank{display:inline-block;width:5ch;border-bottom:4px solid var(--text);transform:translateY(-.1em)}
.ans{background:var(--sun);color:var(--navy);padding:0 8px;border-radius:8px}
.clue{
  align-self:flex-start;max-width:100%;padding:8px 14px;border:3px dashed var(--line);border-radius:14px;background:var(--paper-2);
  font:400 clamp(22px,4vw,30px)/1.3 var(--font-display);letter-spacing:.14em;overflow-wrap:anywhere;
}
.clue small{display:block;font:700 13px/1.2 var(--font-body);letter-spacing:0;color:var(--muted);margin-bottom:2px}
.minis{display:flex;gap:8px;flex-wrap:wrap}
.mini{height:36px;padding:0 14px;border-radius:99px;border:3px solid var(--line);background:var(--paper-2);color:var(--text);font-weight:700;font-size:15px}
.peeked{font:400 22px/1 var(--font-display);padding:6px 12px;border-radius:10px;background:var(--sun);color:var(--navy);border:3px solid var(--line)}
.actions{grid-column:1 / -1;display:flex;flex-direction:column;gap:12px}
.reveal{
  height:62px;border-radius:18px;border:4px solid var(--line);background:var(--sun);color:var(--navy);
  font:400 28px/1 var(--font-display);box-shadow:4px 4px 0 var(--line);
}
.reveal:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.judge{display:grid;grid-template-columns:96px repeat(3,minmax(0,1fr));gap:10px;align-items:center}
.judge .lab{font:400 20px/1.1 var(--font-display)}
.jb{
  min-height:56px;padding:8px 10px;border:4px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--line);
  font:400 20px/1.1 var(--font-display);text-align:center;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;gap:8px;
}
.jb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.jb.ok.a{background:var(--a);color:#fff}
.jb.ok.b{background:var(--b);color:#fff}
.jb.ok.both{background:var(--good);color:#fff}
.jb.no{background:var(--paper);color:var(--text)}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:3px solid var(--line)}
.dot.a{background:var(--a)} .dot.b{background:var(--b)} .dot.both{background:linear-gradient(90deg,var(--a) 50%,var(--b) 50%)}
kbd{font:700 12px/1 var(--font-body);border:2px solid currentColor;border-radius:6px;padding:2px 6px;opacity:.85}
.skip{align-self:center;background:none;border:0;color:var(--muted);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:4px;padding:4px 10px}
.skip:hover{color:var(--text)}

/* reaction */
.react{
  width:min(620px,100%);margin:auto;border:5px solid var(--line);border-radius:28px;box-shadow:10px 10px 0 var(--line);overflow:hidden;
  background:var(--paper);color:var(--text);animation:rise .24s ease-out;text-align:center;
}
.react .top{padding:22px 24px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--rbg)}
.react.ok{--rbg:#BDEBCB}
.react.no{--rbg:#C8D8F7}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .react.ok{--rbg:#1F5A3A}
  :root:not([data-theme="light"]) .react.no{--rbg:#2A3F73}
}
:root[data-theme="dark"] .react.ok{--rbg:#1F5A3A}
:root[data-theme="dark"] .react.no{--rbg:#2A3F73}
.mascot{width:min(230px,56vw);aspect-ratio:1;background:#fff;border:4px solid var(--line);border-radius:26px;box-shadow:5px 5px 0 var(--line);overflow:hidden}
.mascot img{display:block;width:100%;height:100%;object-fit:contain}
.react.ok .mascot{animation:hop .7s ease-in-out 2}
.react.no .mascot{animation:sway 1.6s ease-in-out 2}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}40%{transform:translateY(-16px) rotate(3deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bubble{
  position:relative;background:#fff;color:var(--navy);border:4px solid var(--line);border-radius:22px;padding:10px 22px 12px;
  font:400 clamp(34px,7vw,50px)/1.05 var(--font-display);box-shadow:4px 4px 0 var(--line);
}
.bubble::before{content:"";position:absolute;left:50%;top:-14px;width:22px;height:22px;background:#fff;border-left:4px solid var(--line);border-top:4px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.react .sub{margin:0;font-size:19px;font-weight:700;line-height:1.35}
.react .bot{padding:16px 24px 20px;display:flex;justify-content:center}
.next{height:56px;padding:0 30px;border-radius:16px;border:4px solid var(--line);background:var(--sun);color:var(--navy);font:400 24px/1 var(--font-display);box-shadow:4px 4px 0 var(--line)}
.next:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}

/* final */
.final{
  width:min(860px,100%);margin:auto;border:5px solid var(--line);border-radius:28px;box-shadow:10px 10px 0 var(--line);overflow:hidden;
  background:var(--paper);color:var(--text);animation:rise .28s ease-out;
}
.fhead{background:var(--roof);color:#fff;text-align:center;padding:18px 20px 16px;border-bottom:5px solid var(--line)}
.fhead small{display:block;font:700 16px/1.2 var(--font-body);opacity:.92}
.fhead h2{margin:4px 0 0;font:400 clamp(36px,7vw,60px)/1.05 var(--font-display);text-shadow:0 3px 0 var(--roof-dark);text-wrap:balance}
.fbody{padding:22px 24px 24px;display:flex;flex-direction:column;gap:22px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sc{
  border:4px solid var(--line);border-radius:20px;padding:14px 16px 16px;color:#fff;background:var(--tc);box-shadow:5px 5px 0 var(--line);position:relative;min-width:0;
}
.sc.win{box-shadow:5px 5px 0 var(--line),0 0 0 6px var(--sun)}
.sc h3{margin:0;font:400 26px/1.1 var(--font-display);overflow-wrap:anywhere}
.sc .n{font:400 74px/1 var(--font-display);font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.22)}
.sc .n span{font:700 16px/1 var(--font-body);margin-left:8px;text-shadow:none}
.sc ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.sc li{width:38px;height:38px;border:3px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.sc li img{display:block;width:100%;height:100%;object-fit:cover}
.crown{position:absolute;right:12px;top:10px;width:46px;height:46px}
.cheer{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:20px;align-items:center}
.cheer .mascot{width:100%}
.affirm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.affirm li{font-size:clamp(17px,2.6vw,21px);font-weight:700;line-height:1.35;padding-left:34px;position:relative}
.affirm li::before{content:"";position:absolute;left:0;top:.18em;width:22px;height:22px;background:var(--sun);border:3px solid var(--line);border-radius:50%}
.affirm li:first-child{font:400 clamp(24px,4vw,32px)/1.2 var(--font-display);padding-left:0}
.affirm li:first-child::before{display:none}
.fbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);z-index:60;
  background:var(--paper);color:var(--text);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--line);
  padding:10px 18px;font-weight:700;max-width:calc(100vw - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}

/* ---------- narrow ---------- */
@media (max-width:900px){
  .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
  .center{grid-column:1 / -1;order:-1}
  .team{margin-top:0;padding:14px 14px 16px}
  .stage{width:min(100%, 520px)}
  .chimney{left:10%}
  .roof{padding-inline:12%}
}
@media (max-width:640px){
  .cbody{grid-template-columns:1fr;gap:16px;padding:16px}
  .tile{max-width:200px;margin:0 auto}
  .band{padding:12px 16px;gap:12px}
  .badge{width:58px;height:58px;font-size:34px}
  .judge{grid-template-columns:repeat(3,minmax(0,1fr))}
  .judge .lab{grid-column:1 / -1}
  .jb{min-height:50px;font-size:16px;padding:6px 6px;overflow-wrap:break-word}
  .jb kbd{display:none}
  .scores{grid-template-columns:1fr}
  .cheer{grid-template-columns:1fr}
  .cheer .mascot{max-width:170px;margin:0 auto}
  .fbody{padding:16px}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>

<div class="app" id="app">
  <header class="roof-wrap">
    <div class="chimney"></div>
    <div class="roof">
      <h1>Chore Wheel</h1>
      <p>She has to… He has to… They have to…</p>
    </div>
  </header>

  <main class="board">
    <section class="team" id="panelA" data-team="A" style="--tc:var(--a)"></section>

    <section class="center">
      <div class="stage" id="stage">
        <div class="pointer">
          <div class="pin" id="pin">
            <svg viewBox="0 0 60 80" aria-hidden="true"><path d="M30 78 L7 30 A25 25 0 1 1 53 30 Z" fill="var(--paper)" stroke="var(--line)" stroke-width="5" stroke-linejoin="round"/><circle cx="30" cy="28" r="9" fill="var(--sun)" stroke="var(--line)" stroke-width="4"/></svg>
          </div>
        </div>
        <svg class="wheel" viewBox="0 0 600 600" role="img" aria-label="Wheel with eight numbered spots"><g id="rot"></g></svg>
        <button class="hub" id="spin" type="button">Spin</button>
      </div>
      <p class="status" id="status"></p>
    </section>

    <section class="team" id="panelB" data-team="B" style="--tc:var(--b)"></section>
  </main>

  <footer class="floor">
    <label class="sel">Challenge
      <select id="optMode">
        <option value="mix">Mix</option>
        <option value="act">Act it out</option>
        <option value="fill">Complete the sentence</option>
      </select>
    </label>
    <label class="tog"><input type="checkbox" id="optSkip"><span class="sw"></span>Skip chores already played</label>
    <label class="tog"><input type="checkbox" id="optMusic"><span class="sw"></span>Music</label>
    <label class="tog"><input type="checkbox" id="optSound"><span class="sw"></span>Sound effects</label>
    <span class="spacer"></span>
    <button class="fbtn" id="undo" type="button">Undo</button>
    <button class="fbtn" id="reset" type="button">New quest</button>
    <button class="fbtn primary" id="end" type="button">End quest</button>
  </footer>
  <p class="hint">made with love by teacher veli</p>
</div>

<!-- challenge -->
<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="ctitle">
    <div class="band">
      <div class="badge" id="cnum">1</div>
      <div><h2 id="ctitle">Act it out!</h2><small id="csub"></small></div>
    </div>
    <div class="cbody">
      <div class="tile hidden-art" id="tile"></div>
      <div class="tcol">
        <p class="how" id="how"></p>
        <div class="sentence">
          <span class="chip" id="pChip">SHE</span>
          <p class="frame" id="frame"></p>
        </div>
        <div class="minis" id="minis">
          <button class="mini" id="showAns" type="button">Show sentence</button>
          <button class="mini" id="showPic" type="button">Show picture</button>
          <button class="mini" id="swap" type="button">Switch challenge</button>
        </div>
      </div>
      <div class="actions">
        <div id="judgeBox">
          <div class="judge" style="margin-bottom:10px">
            <span class="lab">Correct</span>
            <button class="jb ok a" data-t="A" data-ok="1" type="button"><kbd>1</kbd><span class="nm-a"></span></button>
            <button class="jb ok b" data-t="B" data-ok="1" type="button"><kbd>2</kbd><span class="nm-b"></span></button>
            <button class="jb ok both" data-t="AB" data-ok="1" type="button"><kbd>3</kbd><span>Both</span></button>
          </div>
          <div class="judge">
            <span class="lab">Not yet</span>
            <button class="jb no" data-t="A" data-ok="0" type="button"><i class="dot a"></i><span class="nm-a"></span></button>
            <button class="jb no" data-t="B" data-ok="0" type="button"><i class="dot b"></i><span class="nm-b"></span></button>
            <button class="jb no" data-t="AB" data-ok="0" type="button"><i class="dot both"></i><span>Both</span></button>
          </div>
        </div>
        <button class="skip" id="skip" type="button">Skip this spin</button>
      </div>
    </div>
  </div>
</div>

<!-- reaction -->
<div class="overlay top" id="reactWrap" hidden>
  <div class="react ok" id="react" role="dialog" aria-modal="true" aria-labelledby="rtitle">
    <div class="top">
      <div class="mascot"><img id="rimg" alt="" src=""></div>
      <div class="bubble" id="rtitle">Keep it up!</div>
      <p class="sub" id="rsub"></p>
    </div>
    <div class="bot"><button class="next" id="next" type="button">Next spin</button></div>
  </div>
</div>

<!-- final -->
<div class="overlay top" id="finalWrap" hidden>
  <div class="final" id="final" role="dialog" aria-modal="true" aria-labelledby="ftitle">
    <div class="fhead"><small>Quest complete</small><h2 id="ftitle"></h2></div>
    <div class="fbody">
      <div class="scores" id="fscores"></div>
      <div class="cheer">
        <div class="mascot"><img id="fimg" alt="Two friends carrying a laundry basket together" src=""></div>
        <ul class="affirm" id="faff"></ul>
      </div>
      <div class="fbtns">
        <button class="fbtn" id="keep" type="button">Keep playing</button>
        <button class="fbtn primary" id="again" type="button">New quest</button>
      </div>
    </div>
  </div>
</div>

    if(!mGain||!ac)return;
    var lvl=anyOpen()?.28:.9;
    try{mGain.gain.setTargetAtTime(lvl,ac.currentTime,.25)}catch(e){}
  }
  function startMusic(){
    if(!ac||!S.opts.music||mTimer)return;
    try{
      mGain=mGain||ac.createGain();mGain.gain.value=0;mGain.connect(ac.destination);
      mNext=ac.currentTime+.12;mStep=0;
      mTimer=setInterval(mSchedule,90);mSchedule();
      mGain.gain.setTargetAtTime(anyOpen()?.28:.9,ac.currentTime,.4);
    }catch(e){mTimer=null}
  }
  function stopMusic(){
    if(mTimer){clearInterval(mTimer);mTimer=null}
    if(mGain&&ac){try{mGain.gain.setTargetAtTime(0,ac.currentTime,.12)}catch(e){}}
  }
  document.addEventListener('visibilitychange',function(){
    if(!ac)return;
    if(document.hidden){try{ac.suspend()}catch(e){}}else if(S.opts.music||S.opts.sound){try{ac.resume()}catch(e){}}
  });

  function paint(kind,count){
    if(reduce)return;
    var cv=$('#confetti'),cx=cv.getContext('2d');if(!cx)return;
    var w=cv.width=innerWidth,h=cv.height=innerHeight;
    var cols=kind==='hearts'?['#F59A8B','#8FC3F5','#B9ADF5','#F6BD3B']:SEG;
    var ps=[];
    for(var i=0;i<count;i++)ps.push({x:w/2+(Math.random()-.5)*w*.35,y:h*.42,vx:(Math.random()-.5)*(kind==='hearts'?6:12),vy:-Math.random()*(kind==='hearts'?9:13)-3,s:(kind==='hearts'?10:6)+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]});
    var t0=performance.now();
    (function f(now){
      var t=now-t0;cx.clearRect(0,0,w,h);
      ps.forEach(function(p){
        p.vy+=kind==='hearts'?.16:.36;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
        cx.save();cx.translate(p.x,p.y);cx.fillStyle=p.c;
        if(kind==='hearts'){var s=p.s;cx.beginPath();cx.moveTo(0,s*.35);cx.bezierCurveTo(-s,-s*.5,-s*.3,-s*1.1,0,-s*.4);cx.bezierCurveTo(s*.3,-s*1.1,s,-s*.5,0,s*.35);cx.fill()}
        else{cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6)}
        cx.restore();
      });
      if(t<2600)requestAnimationFrame(f);else cx.clearRect(0,0,w,h);
    })(t0);
  }
  var tt;
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2800)}

  /* ---------- overlays ---------- */
  function anyOpen(){return !$('#overlay').hidden||!$('#reactWrap').hidden||!$('#finalWrap').hidden}
  function lock(on){$('#app').inert=on;duck()}

  /* ---------- spin ---------- */
  function flick(){
    if(reduce)return;
    var pin=$('#pin');if(!pin.animate)return;
    pin.animate([{transform:'rotate(-20deg)'},{transform:'rotate(0deg)'}],{duration:130,easing:'ease-out'});
  }
  function spin(){
    if(spinning||anyOpen())return;
    initAudio();
    var all=[0,1,2,3,4,5,6,7];
    var pool=S.opts.skip?all.filter(function(s){return S.used.indexOf(S.order[s])<0}):all;
    if(!pool.length){S.used=[];pool=all;render();toast('All 8 chores were played. The wheel is full again.')}
    var seg=pool[Math.floor(Math.random()*pool.length)];
    var target=((360-(seg+.5)*45+(Math.random()*28-14))%360+360)%360;
    var curA=((rot%360)+360)%360;
    var delta=((target-curA)%360+360)%360;
    var turns=reduce?1:5+Math.floor(Math.random()*3);
    var total=360*turns+delta,dur=reduce?900:5200+Math.random()*900;
    var from=rot,t0=performance.now(),last=segAt(rot);
    spinning=true;$('#spin').disabled=true;
    (function frame(now){
      var t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,4);
      rot=from+total*e;applyRot();
      var sg=segAt(rot);if(sg!==last){last=sg;tick();flick()}
      if(t<1)requestAnimationFrame(frame);else{spinning=false;$('#spin').disabled=false;openChallenge(seg)}
    })(t0);
  }

  /* ---------- challenge card ---------- */
  function pickType(){
    var m=S.opts.mode;
    return m==='act'||m==='fill'?m:(Math.random()<.5?'act':'fill');
  }
  function openChallenge(seg){
    S.round++;
    cur={seg:seg,idx:S.order[seg],p:CH[S.order[seg]].p,type:pickType(),shown:false,pic:false};
    cur.pic=cur.type==='fill';
    save();
    renderCard();
    $('#overlay').hidden=false;lock(true);
    var f=$('#judgeBox .jb');if(f)f.focus();
    chime([660,880],.1);
  }
  function renderCard(){
    var ch=CH[cur.idx],p=cur.p,ph=phrase(ch,p);
    $('#card').style.setProperty('--seg',SEG[cur.seg]);
    $('#cnum').textContent=cur.seg+1;
    $('#ctitle').textContent=cur.type==='act'?'Act it out!':'Complete the sentence!';
    $('#csub').textContent='Round '+S.round;
    $('#how').textContent=cur.type==='act'?
      'One student acts out the chore, with no talking. The team says the full sentence.':
      'Look at the picture. Say the full sentence.';
    var chip=$('#pChip');chip.textContent=p.toUpperCase();chip.dataset.p=p;
    var lead=cap(p)+' '+verb(p)+' ';
    $('#frame').innerHTML=cur.shown?lead+'<span class="ans">'+ph+'.</span>':lead+'<span class="blank">&nbsp;</span>';
    var tile=$('#tile');
    if(cur.pic){
      if(tile.dataset.k!==ch.id){tile.className='tile flip';tile.dataset.k=ch.id;tile.innerHTML='<img alt="'+ph+'" src="'+IMG[ch.id]+'">'}
      else tile.className='tile';
      tile.firstChild.alt=ph;tile.removeAttribute('role');tile.removeAttribute('tabindex');
    }else{
      tile.dataset.k='';tile.className='tile hidden-art';
      tile.setAttribute('role','button');tile.setAttribute('tabindex','0');tile.setAttribute('aria-label','Show the picture');
      tile.innerHTML='<div><b>?</b><span>Tap to show the picture</span></div>';
    }
    $('#showPic').textContent=cur.pic?'Hide picture':'Show picture';
    $('#showAns').textContent=cur.shown?'Hide sentence':'Show sentence';
    labels();
  }
  function closeCard(){$('#overlay').hidden=true;lock(false);var t=$('#tile');t.innerHTML='';t.dataset.k=''}

  /* ---------- judging + reaction ---------- */
  function judge(teams,ok){
    if(!cur)return;
    var idx=cur.idx,added=false;
    if(ok)teams.forEach(function(t){S.score[t]++;S.taken[t].push(idx)});
    if(S.opts.skip&&S.used.indexOf(idx)<0){S.used.push(idx);added=true}
    log.push({idx:idx,teams:teams.slice(),ok:ok,added:added});
    closeCard();cur=null;render();
    showReaction(teams,ok);
  }
  function showReaction(teams,ok){
    var pool=ok?OK_MASCOTS:NO_MASCOTS,k;
    do{k=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&k===lastReact);
    lastReact=k;
    var r=$('#react');r.className='react '+(ok?'ok':'no');
    $('#rimg').src=IMG[k];
    $('#rtitle').textContent=ok?'Keep it up!':'Don’t give up!';
    $('#rsub').textContent=ok?
      (teams.length===2?who(teams)+' both earn a point.':nm(teams[0])+' earns a point.'):
      who(teams)+', you can do it. Try again on the next spin!';
    $('#reactWrap').hidden=false;lock(true);
    $('#next').focus();
    if(ok){chime([784,988,1319],.11);paint('confetti',90)}
    else{chime([440,392],.18);paint('hearts',26)}
  }
  function closeReaction(){$('#reactWrap').hidden=true;lock(false);try{$('#spin').focus()}catch(e){}}

  /* ---------- undo / reset ---------- */
  function undo(){
    if(anyOpen())return;
    var e=log.pop();if(!e)return;
    if(e.ok)e.teams.forEach(function(t){S.score[t]=Math.max(0,S.score[t]-1);var a=S.taken[t],i=a.lastIndexOf(e.idx);if(i>-1)a.splice(i,1)});
    if(e.added)S.used=S.used.filter(function(x){return x!==e.idx});
    render();toast('Undone.');
  }
  var armed=false,armT;
  function disarm(){armed=false;clearTimeout(armT);$('#reset').textContent='New quest'}
  function newQuest(){
    var keep={names:S.names,opts:S.opts};
    S=defaults();S.names=keep.names;S.opts=keep.opts;log=[];
    $('#finalWrap').hidden=true;lock(false);
    render();toast('New quest. Scores and chores are cleared.');
  }

  /* ---------- end quest ---------- */
  var TROPHY='<svg class="crown" viewBox="0 0 48 48" aria-hidden="true"><path d="M13 6h22v12a11 11 0 0 1-22 0z" fill="#F5B82E" stroke="#1E2A44" stroke-width="3" stroke-linejoin="round"/><path d="M13 10H6c0 8 3 12 8 13M35 10h7c0 8-3 12-8 13" fill="none" stroke="#1E2A44" stroke-width="3" stroke-linecap="round"/><path d="M24 29v7M16 42h16M18 36h12v6H18z" fill="#F5B82E" stroke="#1E2A44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  function endQuest(){
    if(anyOpen())return;
    if(!log.length){toast('Play at least one round, then end the quest.');return}
    var a=S.score.A,b=S.score.B,tie=a===b,win=a>b?'A':'B',lose=win==='A'?'B':'A';
    $('#ftitle').textContent=tie?'It’s a tie!':nm(win)+' wins!';
    $('#fscores').innerHTML=['A','B'].map(function(k){
      return '<div class="sc'+(!tie&&win===k?' win':'')+'" style="--tc:var(--'+(k==='A'?'a':'b')+')">'+
        (!tie&&win===k?TROPHY:'')+
        '<h3>'+esc(nm(k))+'</h3>'+
        '<div class="n">'+S.score[k]+'<span>points</span></div>'+
        '<ul>'+thumbs(S.taken[k])+'</ul></div>';
    }).join('');
    var L=[];
    if(tie){
      L.push('Both teams win today!');
      L.push(nm('A')+' and '+nm('B')+', you worked hard and you stayed kind to each other.');
    }else{
      L.push('Great job, '+nm(win)+'!');
      L.push(nm(win)+', you listened, you spoke, and you tried. That is how English grows.');
      L.push(nm(lose)+', you were brave to try. Every sentence made your English stronger.');
    }
    L.push('Mistakes help us learn. Everyone practiced real English today.');
    $('#faff').innerHTML=L.map(function(t){return '<li>'+esc(t)+'</li>'}).join('');
    $('#fimg').src=IMG.laundry;
    $('#finalWrap').hidden=false;lock(true);
    $('#again').focus();
    chime([523,659,784,1046],.13);paint('confetti',140);
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  /* ---------- events ---------- */
  $('#spin').addEventListener('click',spin);
  $('#showAns').addEventListener('click',function(){if(!cur)return;cur.shown=!cur.shown;renderCard()});
  $('#skip').addEventListener('click',function(){S.round=Math.max(0,S.round-1);save();closeCard();cur=null;toast('Skipped. The chore stays on the wheel.')});
  function togglePic(){if(!cur)return;cur.pic=!cur.pic;renderCard()}
  $('#showPic').addEventListener('click',togglePic);
  $('#tile').addEventListener('click',function(){if(cur&&!cur.pic)togglePic()});
  $('#tile').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&cur&&!cur.pic){e.preventDefault();e.stopPropagation();togglePic()}});
  $('#swap').addEventListener('click',function(){if(!cur)return;cur.type=cur.type==='act'?'fill':'act';cur.pic=cur.type==='fill';renderCard()});
  $('#judgeBox').addEventListener('click',function(e){
    var b=e.target.closest('.jb');if(!b)return;
    judge(b.dataset.t==='AB'?['A','B']:[b.dataset.t],b.dataset.ok==='1');
  });
  $('#next').addEventListener('click',closeReaction);
  $('#undo').addEventListener('click',undo);
  $('#end').addEventListener('click',endQuest);
  $('#keep').addEventListener('click',function(){$('#finalWrap').hidden=true;lock(false);try{$('#spin').focus()}catch(e){}});
  $('#again').addEventListener('click',newQuest);
  $('#reset').addEventListener('click',function(){
    if(!armed){armed=true;$('#reset').textContent='Tap again to clear';armT=setTimeout(disarm,3000);return}
    disarm();newQuest();
  });
  $('#optMode').value=S.opts.mode;
  $('#optMode').addEventListener('change',function(){S.opts.mode=$('#optMode').value;save()});
  var mEl=$('#optMusic');mEl.checked=!!S.opts.music;
  mEl.addEventListener('change',function(){
    S.opts.music=mEl.checked;save();
    if(mEl.checked){initAudio();startMusic()}else stopMusic();
  });
  [['#optSkip','skip'],['#optSound','sound']].forEach(function(p){
    var el=$(p[0]);el.checked=!!S.opts[p[1]];
    el.addEventListener('change',function(){
      S.opts[p[1]]=el.checked;
      if(p[1]==='sound'&&el.checked){initAudio();if(ac){try{blip(660,ac.currentTime,.1,.1)}catch(e){}}}
      render();
    });
  });

  document.addEventListener('keydown',function(e){
    var tag=(e.target&&e.target.tagName)||'';
    if(tag==='INPUT'&&e.target.type!=='checkbox')return;
    if(tag==='SELECT')return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(!$('#finalWrap').hidden){if(e.key==='Escape'){$('#keep').click()}return}
    if(!$('#reactWrap').hidden){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){e.preventDefault();closeReaction()}return}
    if(!$('#overlay').hidden&&cur){
      var k=e.key;
      if(k==='Escape'){$('#skip').click();return}
      if(k==='s'||k==='S'){cur.shown=!cur.shown;renderCard();return}
      if(k==='p'||k==='P'){togglePic();return}
      if(k==='1')judge(['A'],true);else if(k==='2')judge(['B'],true);else if(k==='3')judge(['A','B'],true);
      else if(k==='4')judge(['A'],false);else if(k==='5')judge(['B'],false);else if(k==='6')judge(['A','B'],false);
      return;
    }
    if((e.key===' '||e.key==='Enter')&&tag!=='BUTTON'&&tag!=='LABEL'){e.preventDefault();spin()}
  });

  buildWheel();buildTeams();render();
})();
</script>

</body></html>
